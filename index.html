<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Base</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
  :root {
    --bg: #0e1015;
    --panel: #151820;
    --panel2: #1c202b;
    --border: #242938;
    --text: #e9ebf1;
    --muted: #8b92a6;
    --accent: #7c5cff;
    --accent2: #6ba8ff;
    --grad: linear-gradient(135deg, #7c5cff, #4f9cff);
    --ok: #3ddc84;
    --warn: #ffb84d;
    --err: #ff6b6b;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Noto Sans", "Noto Sans Malayalam", "Noto Sans Devanagari", "Noto Sans Tamil", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--grad);
    display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .brand b { font-size: 14px; font-weight: 600; letter-spacing: .01em; }
  .hactions { display: flex; gap: 6px; align-items: center; }
  .iconbtn {
    background: none; border: 1px solid transparent; color: var(--muted);
    border-radius: 8px; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .iconbtn:hover { background: var(--panel2); color: var(--text); }
  #modelChip {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); cursor: pointer;
    padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); transition: border-color .15s;
    white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis;
  }
  #modelChip:hover { border-color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 7px var(--ok); }
  .dot.load { background: var(--warn); animation: pulse 1s infinite; }
  .dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .3; } }

  #notice {
    display: none; padding: 8px 16px; font-size: 12.5px;
    background: #332614; color: #ffd9a0; border-bottom: 1px solid var(--border);
    text-align: center;
  }
  #notice.show { display: block; }

  /* ---------- chat ---------- */
  #chat {
    flex: 1; overflow-y: auto; padding: 20px 14px;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: var(--radius);
    line-height: 1.6; font-size: 14.5px; overflow-wrap: break-word;
    animation: pop .16s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot.error { border-color: var(--err); color: #ffc2c2; }
  .msg code { background: rgba(0,0,0,.35); padding: 2px 5px; border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px; }
  .msg pre {
    background: #0d1017; border: 1px solid var(--border);
    padding: 11px; border-radius: 9px; overflow-x: auto; margin: 7px 0;
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px; line-height: 1.5;
    position: relative; white-space: pre;
  }
  .copybtn {
    position: absolute; top: 5px; right: 5px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 5px; font-size: 10.5px; padding: 2px 8px; cursor: pointer; font-family: inherit;
  }
  .copybtn:hover { color: var(--text); border-color: var(--accent); }
  .msg .meta { display: block; font-size: 10px; opacity: .45; margin-top: 5px; text-align: right; }
  .msg a, .card a { color: var(--accent2); }
  .srcbox { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);
    font-size: 11.5px; color: var(--muted); display: grid; gap: 3px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    display: inline-block; margin-right: 4px; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .card { align-self: flex-start; max-width: 86%; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 13.5px; }
  .card h3 { font-size: 12px; margin-bottom: 8px; color: var(--accent2); font-weight: 600; }
  .card .item { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); line-height: 1.5; }
  .card .item:last-child { border-bottom: none; }
  .card .item b { display: block; font-size: 13.5px; }
  .card .item .small { font-size: 12px; color: var(--muted); }
  .card .item a { font-size: 12px; text-decoration: none; }
  .card .btnrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .card textarea {
    width: 100%; background: #0d1017; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px; font-size: 13px; font-family: inherit; min-height: 90px; resize: vertical;
  }
  .btn {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 13px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: border-color .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--grad); border: none; color: #fff; font-weight: 600; }

  .welcome { align-self: center; text-align: center; max-width: 520px; margin: auto 0; color: var(--muted); padding: 0 8px; }
  .welcome .big { font-size: 36px; margin-bottom: 10px; }
  .welcome h2 { color: var(--text); font-size: 18px; margin-bottom: 6px; font-weight: 600; }
  .welcome p { font-size: 13.5px; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 16px; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 13px; font-size: 12.5px; cursor: pointer; color: var(--text); font-family: inherit; }
  .chip:hover { border-color: var(--accent); }

  /* ---------- composer ---------- */
  footer { padding: 8px 14px 14px; background: var(--bg); border-top: 1px solid var(--border); }
  .tools { display: flex; gap: 5px; max-width: 820px; margin: 0 auto 8px; flex-wrap: wrap; }
  .tool {
    background: none; border: 1px solid transparent; border-radius: 999px;
    padding: 5px 11px; font-size: 12px; cursor: pointer; color: var(--muted);
    font-family: inherit; transition: all .15s;
  }
  .tool:hover { background: var(--panel2); color: var(--text); }
  .tool.on { color: var(--accent2); background: rgba(107,168,255,.1); border-color: rgba(107,168,255,.35); }
  .composer { display: flex; gap: 8px; align-items: flex-end; max-width: 820px; margin: 0 auto; }
  #input {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); padding: 11px 15px; font-size: 14.5px; font-family: inherit;
    resize: none; max-height: 140px; min-height: 44px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send { height: 44px; width: 44px; border-radius: 12px; border: none;
    background: var(--grad); color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0;
    transition: opacity .15s;
  }
  #send:disabled { opacity: .35; cursor: not-allowed; }

  /* ---------- model panel ---------- */
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 50; }
  #overlay.open { display: block; }
  #modelPanel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border); z-index: 51;
    transform: translateX(100%); transition: transform .22s ease;
    overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
  }
  #modelPanel.open { transform: none; }
  #modelPanel h2 { font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .field label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .field select, .field textarea {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 9px 11px; font-size: 12.5px; font-family: inherit; outline: none;
  }
  .field select:focus, .field textarea:focus { border-color: var(--accent); }
  #progwrap { display: none; }
  #progwrap.show { display: block; }
  #progbar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  #progfill { height: 100%; width: 0%; background: var(--grad); transition: width .3s; }
  #progtext { font-size: 11px; color: var(--muted); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%) translateY(70px);
    background: var(--panel2); border: 1px solid var(--accent); color: var(--text);
    padding: 9px 16px; border-radius: 9px; font-size: 12.5px;
    transition: transform .25s ease; z-index: 99;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">🧠</div>
    <b>My AI Base</b>
  </div>
  <div class="hactions">
    <span id="modelChip" title="Model"><span class="dot" id="statusDot"></span><span id="statusText">no model</span></span>
    <button class="iconbtn" id="newChat" title="New chat">＋</button>
    <button class="iconbtn" id="openPanel" title="Model">⚙</button>
  </div>
</header>

<div id="notice"></div>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="big">🧠</div>
    <h2>Your own AI — runs in this browser</h2>
    <p>No API. No cost. Fully private.</p>
    <div class="chips">
      <button class="chip">Write a Python prime-number function</button>
      <button class="chip">ഒരു ചെറിയ കഥ പറയൂ</button>
      <button class="chip">search: Kerala monsoon</button>
    </div>
  </div>
</div>

<footer>
  <div class="tools">
    <button class="tool" data-tool="search">🔍 Search</button>
    <button class="tool" data-tool="place">📍 Places</button>
    <button class="tool" data-tool="doc">📄 Document</button>
    <button class="tool" data-tool="email">✉️ Email</button>
    <button class="tool" data-tool="code">💻 Code</button>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
    <button id="send" title="Send">➤</button>
  </div>
</footer>

<div id="overlay"></div>
<aside id="modelPanel">
  <h2>Model <button class="iconbtn" id="closePanel">✕</button></h2>

  <div class="field">
    <label for="modelSel">Model</label>
    <select id="modelSel"></select>
  </div>

  <div id="progwrap">
    <div id="progbar"><div id="progfill"></div></div>
    <div id="progtext"></div>
  </div>

  <button class="btn primary" id="loadBtn">Load</button>

  <div class="field">
    <label for="persona">Personality (optional)</label>
    <textarea id="persona" placeholder="e.g. a friendly teacher who uses simple examples"></textarea>
  </div>

  <button class="btn" id="savePersona">Save</button>
</aside>

<input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.log,.xml,.html,.js,.py" style="display:none">
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
